<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SecOps Network Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- Sliding Drawer: per-flow inspection -->
  <div id="sideDrawer" class="drawer">
    <div class="drawer-header">
      <h3 id="drawerTitle">Flow Details</h3>
      <button id="closeDrawer" class="btn-close">&times;</button>
    </div>
    <div class="drawer-content">
      <div id="drawerBody"></div>
    </div>
  </div>

  <div class="dashboard">
    <!-- Zone 1: Top Navigation & Filter Bar -->
    <header class="top-bar">
      <div class="status-indicator">
        <span class="shield-icon">&#128737;</span>
        <span id="globalStatus" class="status-text healthy">Connecting&hellip;</span>
      </div>
      <div class="search-container">
        <input type="text" id="globalSearch" placeholder="Filter by IP, host, country, or protocol&hellip;">
      </div>
      <div class="controls">
        <button id="togglePause" class="btn">Pause Traffic</button>
      </div>
    </header>

    <!-- Zone 2: KPI Cards -->
    <section class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-title">Download</div>
        <div class="kpi-value" id="kpiDownload">0 B/s</div>
        <div class="kpi-subtext">Peak <span id="kpiPeakDown">0 B/s</span> &middot; Total <span id="kpiTotalDown">0 B</span></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Upload</div>
        <div class="kpi-value" id="kpiUpload">0 B/s</div>
        <div class="kpi-subtext">Peak <span id="kpiPeakUp">0 B/s</span> &middot; Total <span id="kpiTotalUp">0 B</span></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Hosts You're Talking To</div>
        <div class="kpi-value" id="kpiHosts">0</div>
        <div class="kpi-subtext"><span id="kpiFlows">0</span> active connections</div>
      </div>
    </section>

    <!-- Zone 2.5: Anomaly Alerts -->
    <section class="panel alerts-panel">
      <h3>Anomaly Alerts <span id="alertCount" class="muted-count"></span></h3>
      <div id="alertsList" class="alerts-list">
        <div class="no-alerts">No anomalies detected.</div>
      </div>
    </section>

    <!-- Zone 3: Center Stage Charts -->
    <section class="charts-grid">
      <div class="panel chart-panel">
        <canvas id="bandwidthChart"></canvas>
      </div>
      <div class="panel chart-panel">
        <canvas id="flowsChart"></canvas>
      </div>
    </section>

    <!-- Zone 4: Bottom Panel Drill-Down -->
    <section class="bottom-panel">
      <div class="panel table-panel">
        <h3>Network Hosts <span id="flowCount" class="muted-count"></span></h3>
        <div class="host-tabs" id="hostTabs">
          <button class="host-tab active" data-role="all">All <span class="tab-count" id="countAll"></span></button>
          <button class="host-tab" data-role="service">🖧 Servers &amp; Services <span class="tab-count" id="countService"></span></button>
          <button class="host-tab" data-role="personal">💻 Personal Computers <span class="tab-count" id="countPersonal"></span></button>
        </div>
        <div class="table-container">
          <table id="flowsTable">
            <thead>
              <tr>
                <th>Host</th>
                <th>Category</th>
                <th>Location</th>
                <th>Activity</th>
                <th>&darr; Down</th>
                <th>&uarr; Up</th>
                <th>Conns</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="flowsBody"></tbody>
          </table>
        </div>
      </div>
      <div class="panel donut-panel">
        <canvas id="protocolChart"></canvas>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
